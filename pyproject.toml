[project]
name = "sekit"
version = "1.0.2"
description = "Python tools to support scientific computing experiments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4"
authors = [
  { name = "Hidetoshi Kawaguchi", email = "kawa.hide39@gmail.com" },
]
dependencies = [
  "pandas>=2.2.2,<3",
  "pyyaml>=6.0.1,<7",
  "matplotlib>=3.9.1,<4",
]

[project.urls]
Homepage = "https://github.com/HidetoshiKawaguchi/sekit"
Repository = "https://github.com/HidetoshiKawaguchi/sekit"
Documentation = "https://github.com/HidetoshiKawaguchi/sekit"

[project.scripts]
sekit-search = "sekit.search.__main__:main"
sekit-stats = "sekit.stats.__main__:main"
sekit-spartan = "sekit.spartan.__main__:main"
sekit-jymatplot = "sekit.jymatplot.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.2.2,<9",
  "ruff>=0.6.9,<1",
  "mypy>=1.11.2,<2",
  "pre-commit>=4.3.0,<5",
  "pandas-stubs>=2.2.3.241126,<3",
  "types-PyYAML>=6.0.12.20250915,<7",
  "twine>=6.2.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sekit"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: marks tests that require integration environments",
]
